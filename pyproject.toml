[project]
name = "boss-zhipin-scraper"
version = "2.2.0"
description = "BOSS直聘职位采集与本地求职决策 Agent — Chrome CDP + 可解释匹配"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "eatmoreduck" }
]
keywords = ["zhipin", "boss", "scraper", "cdp", "jobs"]

dependencies = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "textual>=0.80,<1",
    "langgraph>=0.6,<2",
    "openai>=1.50,<3",
    "anthropic>=0.40,<1",
    "keyring>=25,<26",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]

[project.optional-dependencies]
agent = [
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "textual>=0.80,<1",
    "langgraph>=0.6,<2",
    "openai>=1.50,<3",
    "anthropic>=0.40,<1",
    "keyring>=25,<26",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]
all = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "textual>=0.80,<1",
    "langgraph>=0.6,<2",
    "openai>=1.50,<3",
    "anthropic>=0.40,<1",
    "keyring>=25,<26",
    "PyMuPDF>=1.24,<2",
    "python-docx>=1.1,<2",
]

[project.scripts]
# 模块路径对应 [tool.hatch.build.targets.wheel] 的 packages=["scripts"]，
# 安装后顶层包名为 scripts，故入口是 scripts.boss_cdp_raw:main
boss-scraper = "scripts.boss_cdp_raw:main"
boss-summary = "scripts.job_summary:main"
jobtrace-agent = "career_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "career_agent"]
# 城市码表 data/city_codes.json 打进 wheel，pip install 后也能读到（见 issue #24）
force-include = { "data/city_codes.json" = "data/city_codes.json" }
